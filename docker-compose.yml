# Local PostgreSQL for development.
# Usage:
#   docker compose up -d db
#   DATABASE_URL=postgresql+psycopg2://familycrm:change-me@localhost:5432/familycrm alembic upgrade head

services:
  db:
    image: postgres:16-alpine
    container_name: familycrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: familycrm
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: familycrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familycrm -d familycrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
